{% extends 'app_base.html' %}

{% block title %}Payment Successful | Badminton Arena{% endblock %}

{% block content %}
<div class="d-flex justify-content-center pt-5">
  <div class="card status-card text-center w-100">
    <div class="card-body p-5">
      <div class="status-icon mx-auto mb-4"><i class="bi bi-check-lg"></i></div>

    </div>
  </div>

{% endblock %}
